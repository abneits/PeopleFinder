<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PeopleFinder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>

    <button id="panel-toggle" type="button" aria-label="Ouvrir le panneau">☰</button>

    <aside id="panel" aria-label="Panneau des traces">
      <header class="panel-header">
        <h1>PeopleFinder</h1>
        <button id="panel-close" type="button" aria-label="Fermer le panneau">✕</button>
      </header>

      <div class="panel-section">
        <label class="toggle">
          <input type="checkbox" id="toggle-show-deleted" />
          <span>Afficher les traces supprimées</span>
        </label>
      </div>

      <!-- Section 1: Tracés déjà cherchés -->
      <div class="panel-section">
        <h2 class="section-title">Tracés déjà cherchés</h2>
        <div class="action-buttons">
          <button class="btn btn-primary btn-upload-gpx" data-kind="search" type="button">
            Upload GPX
          </button>
          <button class="btn btn-primary btn-start-manual" data-kind="search" type="button">
            Tracer manuellement
          </button>
        </div>
        <input type="file" class="gpx-file-input" data-kind="search"
               accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden />
        <ul id="search-list" class="trace-list"></ul>
        <p class="muted search-empty">Aucun tracé pour le moment.</p>
      </div>

      <!-- Section 2: Tracés à chercher -->
      <div class="panel-section">
        <h2 class="section-title">Tracés à chercher</h2>
        <div class="action-buttons">
          <button class="btn btn-primary btn-upload-gpx" data-kind="todo" type="button">
            Upload GPX
          </button>
          <button class="btn btn-primary btn-start-manual" data-kind="todo" type="button">
            Tracer manuellement
          </button>
        </div>
        <input type="file" class="gpx-file-input" data-kind="todo"
               accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden />
        <ul id="todo-list" class="trace-list"></ul>
        <p class="muted todo-empty">Aucun tracé pour le moment.</p>
      </div>
    </aside>

    <!-- Bandeau d'aide du mode manuel -->
    <div id="manual-banner" class="banner hidden">
      <span class="banner-text" id="manual-banner-text">
        Mode manuel : cliquez sur la carte pour ajouter des points.
      </span>
      <div class="banner-actions">
        <button id="manual-undo" class="btn" type="button" disabled>Annuler dernier point</button>
        <button id="manual-finish" class="btn btn-primary" type="button" disabled>Terminer</button>
        <button id="manual-cancel" class="btn" type="button">Quitter</button>
      </div>
    </div>

    <!-- Modale: métadonnées -->
    <div id="modal-meta" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <header class="modal-header">
          <h2 id="modal-meta-title">Métadonnées</h2>
          <button class="modal-close" data-close="modal-meta" type="button" aria-label="Fermer">✕</button>
        </header>
        <form id="meta-form" class="form">
          <label>
            Nom
            <input type="text" name="name" maxlength="200" required />
          </label>
          <label>
            Auteur
            <input type="text" name="author" maxlength="200" required />
          </label>
          <label id="confidence-field">
            Niveau de confiance
            <select name="confidence">
              <option value="low">Faible</option>
              <option value="medium" selected>Moyen</option>
              <option value="high">Fort</option>
            </select>
          </label>
          <label>
            Date
            <input type="date" name="recorded_at" required />
          </label>
          <div class="form-actions">
            <button type="button" class="btn" data-close="modal-meta">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
          <p id="meta-error" class="error hidden"></p>
        </form>
      </div>
    </div>

    <!-- Modale: confirmation suppression -->
    <div id="modal-delete" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <header class="modal-header">
          <h2>Supprimer la trace</h2>
          <button class="modal-close" data-close="modal-delete" type="button" aria-label="Fermer">✕</button>
        </header>
        <p id="modal-delete-text">Supprimer la trace ? Cette action est irréversible.</p>
        <div class="form-actions">
          <button type="button" class="btn" data-close="modal-delete">Annuler</button>
          <button type="button" id="confirm-delete" class="btn btn-danger">Supprimer</button>
        </div>
      </div>
    </div>

    <!-- Toast erreur générique -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
